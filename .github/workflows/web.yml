name: Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure logic unit tests (core, audio, segment, assembly, home, sync)
        run: |
          for f in core audio segment assembly home sync comp canonical-web; do
            if [ -f "tests/web/$f.test.js" ]; then
              echo "== $f =="
              node "tests/web/$f.test.js"
            fi
          done
      - name: Worker tests
        run: node worker/test/worker.test.js
      - name: Install Playwright browser for canonical reload test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Canonical web metadata survives browser reload
        run: node tests/web/canonical-web.e2e.js

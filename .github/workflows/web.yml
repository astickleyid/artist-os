name: Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    # Playwright 1.55's browser dependency installer is verified on this LTS image.
    # Pinning avoids an unreviewed ubuntu-latest image change breaking the E2E gate.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure logic unit tests (core, audio, segment, assembly, home, sync)
        run: |
          for f in core audio segment assembly home sync comp canonical-web; do
            if [ -f "tests/web/$f.test.js" ]; then
              echo "== $f =="
              node "tests/web/$f.test.js"
            fi
          done
      - name: Worker tests
        run: node worker/test/worker.test.js
      - name: Install Playwright browser for canonical reload test
        env:
          # Prevent npm postinstall from starting a second, implicit browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Canonical web metadata survives browser reload
        run: node tests/web/canonical-web.e2e.js
